<!DOCTYPE html>
<html lang="en-US">
<head>
	<title>Task List</title>
</head>
<body>
	<div id="content">
		<ul>
			{% for item in tasks %}
				<li>Task Name: {{ item.name }}</li>
			{% endfor %}
		</ul>
	</div>
	<form method="post">
		{% csrf_token %}
		<label for="task_name">
			<span>Task Name</span>
			<input type="text" id="task_name" name="task_name">
		</label>
		<button type="submit">Submit</button>
	</form>
</body>
</html>
